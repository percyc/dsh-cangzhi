# Cangzhi's dual-face package contributes model guidance and the DSH Web UI.
# The generic DSH MCP bridge owns transport, discovery, cancellation and
# reconnect behavior. Keep secrets in the launch environment/credential
# manager; this patch never persists the PAT.
- insert:
    - id: cangzhi
      name: dsh-cangzhi
      config:
        webUrl: !!js process.env.CANGZHI_WEB_URL ?? 'http://127.0.0.1:3000'
        apiUrl: !!js process.env.CANGZHI_API_URL ?? 'http://127.0.0.1:8000'
        internalMcpPort: !!js Number(process.env.CANGZHI_DSH_MCP_PORT ?? '3081')
        defaultWorkspace: !!js process.env.CANGZHI_WORKSPACE ?? 'default'

    - id: cangzhi-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: cangzhi
        # Always use the loopback credential proxy owned by this plugin. The
        # browser and model process never receive the Cangzhi PAT directly.
        url: !!js "'http://127.0.0.1:' + (process.env.CANGZHI_DSH_MCP_PORT ?? '3081') + '/api/mcp'"
        headers: {}
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 100000
